name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Never run two deployments at once; queue instead of cancelling a
# deployment that is already rolling out.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: calgary-transit

jobs:
  ci:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile backend sources
        run: python -m compileall -q backend -x 'venv|__pycache__'

  build-and-deploy:
    name: Deploy to AWS EC2
    needs: ci
    # Deploy only on pushes to master (and manual dispatches), never on PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC to AWS
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          b64() { base64 -w0 "$1"; }
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "commands=[
              \"mkdir -p /opt/calgary-transit\",
              \"echo $(b64 deploy/docker-compose.yml) | base64 -d > /opt/calgary-transit/docker-compose.yml\",
              \"echo $(b64 deploy/Caddyfile) | base64 -d > /opt/calgary-transit/Caddyfile\",
              \"echo $(b64 deploy/deploy.sh) | base64 -d > /opt/calgary-transit/deploy.sh\",
              \"bash /opt/calgary-transit/deploy.sh $IMAGE\"
            ]" \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = "Success" ]
