name: CalgaryTransit
options:
  bundleIdPrefix: com.benedictkpaduwa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CalgaryTransit:
    type: application
    platform: iOS
    sources:
      - CalgaryTransit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benedictkpaduwa.calgarytransit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 34D4VY49ZK
      configs:
        Debug:
          # Simulator can reach the Mac's backend on localhost. For a physical
          # device use your Mac's LAN IP, e.g. http://192.168.1.20:8000
          API_BASE_URL: http://192.168.1.128:8000
        Release:
          # Same host the web app is served from; nginx proxies /api -> FastAPI.
          API_BASE_URL: https://YOUR-APP.ondigitalocean.app/api
    info:
      path: CalgaryTransit/Info.plist
      properties:
        CFBundleDisplayName: Calgary Transit
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Calgary Transit uses your location to show nearby stops and plan trips from where you are.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
