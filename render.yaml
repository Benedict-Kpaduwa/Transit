# Render Blueprint — Calgary Transit
# This file defines both services for one-click deploy on Render.
# Docs: https://docs.render.com/blueprint-spec

services:
  # ── Backend: FastAPI Web Service ──
  - type: web
    name: calgary-transit-api
    runtime: docker
    repo: https://github.com/Benedict-Kpaduwa/Transit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CALGARY_APP_TOKEN
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: TRANSIT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # ── Frontend: Vite Static Site ──
  - type: web
    name: calgary-transit
    runtime: static
    repo: https://github.com/Benedict-Kpaduwa/Transit
    buildCommand: cd frontend && pnpm install && pnpm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
