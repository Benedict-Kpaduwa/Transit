# DigitalOcean App Platform Spec — Calgary Transit
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: calgary-transit

services:
  # ── Backend: FastAPI (Docker) ──
  - name: calgary-transit-api
    github:
      repo: Benedict-Kpaduwa/Transit
      branch: main
      deploy_on_push: true
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: CALGARY_APP_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: MAPBOX_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TRANSIT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET

static_sites:
  # ── Frontend: Vite Static Site ──
  - name: calgary-transit-web
    github:
      repo: Benedict-Kpaduwa/Transit
      branch: main
      deploy_on_push: true
    source_dir: frontend
    build_command: pnpm install && pnpm run build
    output_dir: dist
    index_document: index.html
    error_document: index.html
    envs:
      - key: VITE_MAPBOX_ACCESS_TOKEN
        scope: BUILD_TIME
        type: SECRET
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ${calgary-transit-api.PUBLIC_URL}
