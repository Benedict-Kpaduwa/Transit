# DigitalOcean App Platform Spec — Calgary Transit (Single Container)
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: calgary-transit

services:
  - name: calgary-transit
    github:
      repo: Benedict-Kpaduwa/Transit
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: professional-xs
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: CALGARY_APP_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: MAPBOX_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TRANSIT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: VITE_MAPBOX_ACCESS_TOKEN
        scope: BUILD_TIME
        type: SECRET
